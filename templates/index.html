<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RevisorAPA - Análisis e Inteligencia APA 7</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Encabezado superior persistente -->
  <header class="app-header">
    <div class="header-brand">
      <span class="header-icon">📜</span>
      <h1>RevisorAPA</h1>
    </div>
    <button id="btn-open-upload" class="btn-secondary">
      📄 Cargar otro documento
    </button>
  </header>

  <!-- Ventana Modal / Overlay de Subida -->
  <div id="upload-overlay" class="upload-overlay">
    <div id="upload-modal" class="upload-modal">
      <button id="btn-close-modal" class="close-modal" title="Cerrar">&times;</button>
      
      <div class="modal-header">
        <span class="modal-kicker">✦ Scriptorium Académico</span>
        <h2>Sube tu trabajo en Word</h2>
        <p>Analizaremos márgenes, formato, citas y referencias según la norma APA 7.ª edición.</p>
      </div>

      <div class="drop-zone" id="drop-zone">
        <div class="drop-zone-icon">📁</div>
        <p class="drop-zone-text">Arrastra tu archivo <strong>.docx</strong> aquí o haz clic para buscar</p>
        <span class="drop-zone-hint">¡Solo se admite formato .docx! ⚠️</span>
        <input type="file" id="file-input" accept=".docx" hidden />
      </div>

      <div id="upload-error" class="upload-error hidden"></div>
      
      <div id="upload-loading" class="upload-loading hidden">
        <div class="spinner"></div>
        <p>Analizando documento y verificando citas...</p>
      </div>
    </div>
  </div>

  <!-- Vista Principal de Resultados (Aprovecha el 100% del ancho) -->
  <main id="analysis-container" class="analysis-container hidden">
    <!-- El informe se renderizará dinámicamente mediante JavaScript -->
  </main>

  <script src="/static/js/app.js"></script>
</body>
</html>
