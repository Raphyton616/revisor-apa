services:
  - type: web
    name: revisor-apa
    runtime: python
    plan: free
    buildCommand: apt-get update -qq && apt-get install -y --no-install-recommends libreoffice-writer poppler-utils fonts-liberation && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
